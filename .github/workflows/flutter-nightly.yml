name: Flutter Nightly Build

on:
  # VeloDesk: sin compilación nocturna automática; lánzala a mano desde la pestaña Actions.
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
